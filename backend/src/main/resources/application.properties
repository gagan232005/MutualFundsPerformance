spring.application.name=mutualfunds-backend
server.port=${PORT:8080}

# ---- Live NAV data source ----
mfapi.base-url=https://api.mfapi.in/mf
mfapi.master-list-ttl-minutes=180
mfapi.history-ttl-minutes=60

# ---- Grok AI Assistant ----
ai.provider=${AI_PROVIDER:grok}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:grok-3-mini}
ai.grok-url=https://api.x.ai/v1/chat/completions

# ---- Error handling ----
server.error.include-message=never
server.error.include-stacktrace=never