spring.application.name=mutualfunds-backend
server.port=${PORT:8080}

mfapi.base-url=https://api.mfapi.in/mf
mfapi.master-list-ttl-minutes=180
mfapi.history-ttl-minutes=60

# ---- Groq AI Assistant ----
ai.provider=${AI_PROVIDER:groq}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:llama-3.3-70b-versatile}
ai.groq-url=https://api.groq.com/openai/v1/chat/completions

server.error.include-message=never
server.error.include-stacktrace=never