spring.application.name=mutualfunds-backend
server.port=${PORT:8080}

# ---- Live NAV data source (AMFI data via mfapi.in, no CSVs) ----
mfapi.base-url=https://api.mfapi.in/mf
mfapi.master-list-ttl-minutes=180
mfapi.history-ttl-minutes=60

# ---- AI Assistant (real LLM call) ----
# Set AI_API_KEY as an environment variable to enable the assistant.
# AI_PROVIDER can be "openai" (default) or "anthropic".
ai.provider=${AI_PROVIDER:openai}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.openai-url=https://api.openai.com/v1/chat/completions
ai.anthropic-url=https://api.anthropic.com/v1/messages

# Keep default error responses minimal; GlobalExceptionHandler owns error shape
server.error.include-message=never
server.error.include-stacktrace=never
